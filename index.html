<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WhisperNet — 익명 ჩატი</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/index.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>
  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <main class="auth-container">
    <div class="brand">
      <div class="brand-icon">◈</div>
      <h1 class="brand-name">WhisperNet</h1>
      <p class="brand-tagline">სადაც სიტყვები თავისუფლად ჟღერს</p>
    </div>

    <!-- Tab Switcher -->
    <div class="tab-bar">
      <button class="tab active" data-tab="login">შესვლა</button>
      <button class="tab" data-tab="register">რეგისტრაცია</button>
    </div>

    <!-- Login Form -->
    <div class="form-panel active" id="panel-login">
      <div class="input-group">
        <label>ელ-ფოსტა</label>
        <input type="email" id="login-email" placeholder="your@email.com" autocomplete="email"/>
      </div>
      <div class="input-group">
        <label>პაროლი</label>
        <input type="password" id="login-pass" placeholder="••••••••" autocomplete="current-password"/>
      </div>
      <button class="btn-primary" id="btn-login">შესვლა</button>
      <div class="divider"><span>ან</span></div>
      <button class="btn-anon" id="btn-anon">
        <span class="anon-icon">👤</span> ანონიმურად შესვლა
      </button>
    </div>

    <!-- Register Form -->
    <div class="form-panel" id="panel-register">
      <!-- Avatar Upload -->
      <div class="avatar-upload-area" id="avatar-area">
        <div class="avatar-preview" id="avatar-preview">
          <div class="avatar-placeholder" id="avatar-placeholder">
            <span id="avatar-random-emoji">🎭</span>
          </div>
          <img id="avatar-img" style="display:none;" alt="avatar"/>
        </div>
        <div class="avatar-actions">
          <button class="btn-small" id="btn-upload-photo">📷 ფოტოს ატვირთვა</button>
          <button class="btn-small secondary" id="btn-random-avatar">🎲 შემთხვევითი</button>
        </div>
        <input type="file" id="photo-input" accept="image/*" style="display:none"/>
      </div>

      <div class="input-group">
        <label>სახელი</label>
        <input type="text" id="reg-name" placeholder="მაგ: მოჩვენება_404" maxlength="20"/>
      </div>

      <div class="gender-select">
        <label>სქესი</label>
        <div class="gender-options">
          <button class="gender-btn active" data-gender="male">♂ მამრობითი</button>
          <button class="gender-btn" data-gender="female">♀ მდედრობითი</button>
          <button class="gender-btn" data-gender="other">⚡ სხვა</button>
        </div>
      </div>

      <div class="input-group">
        <label>ელ-ფოსტა</label>
        <input type="email" id="reg-email" placeholder="your@email.com" autocomplete="email"/>
      </div>
      <div class="input-group">
        <label>პაროლი</label>
        <input type="password" id="reg-pass" placeholder="მინ. 6 სიმბოლო" autocomplete="new-password"/>
      </div>

      <button class="btn-primary" id="btn-register">ანგარიშის შექმნა</button>
    </div>

    <div class="toast" id="toast"></div>
  </main>

  <script type="module" src="js/firebase-init.js"></script>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
