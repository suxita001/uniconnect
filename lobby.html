<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WhisperNet — ლობი</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/lobby.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>
  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>

  <!-- Top Nav -->
  <nav class="top-nav">
    <div class="nav-brand">◈ WhisperNet</div>
    <div class="nav-right">
      <div class="online-pill">
        <span class="pulse-dot"></span>
        <span id="online-count">0</span> ონლაინ
      </div>
      <div class="user-avatar-small" id="nav-avatar" title="პროფილი">?</div>
      <button class="btn-icon" id="btn-logout" title="გამოსვლა">⏻</button>
    </div>
  </nav>

  <main class="lobby-main">
    <!-- Profile Card -->
    <div class="profile-card glass">
      <div class="profile-avatar-wrap">
        <div class="profile-avatar" id="profile-avatar">?</div>
        <div class="profile-status online"></div>
      </div>
      <div class="profile-info">
        <h2 id="profile-name">Loading...</h2>
        <p id="profile-gender" class="profile-gender">—</p>
      </div>
    </div>

    <!-- Mode Selection -->
    <section class="mode-section">
      <h3 class="section-title">ჩატის რეჟიმი</h3>
      <div class="mode-cards">
        <div class="mode-card active" data-mode="classic">
          <div class="mode-icon">💬</div>
          <div class="mode-label">კლასიკური</div>
          <div class="mode-desc">უბრალო 1:1 ჩატი</div>
          <div class="mode-check">✓</div>
        </div>
        <div class="mode-card" data-mode="roleplay">
          <div class="mode-icon">🎭</div>
          <div class="mode-label">როლფლეი</div>
          <div class="mode-desc">სისტემა გაძლევს პერსონაჟს</div>
          <div class="mode-check">✓</div>
        </div>
      </div>
    </section>

    <!-- Roleplay Role Preview (hidden by default) -->
    <div class="role-preview glass" id="role-preview" style="display:none">
      <div class="role-badge">🎲 შენი როლი:</div>
      <div class="role-name" id="role-display">—</div>
      <div class="role-hint">ჩატში ამ პერსონაჟის სახელით ისაუბრე</div>
    </div>

    <!-- Find Chat Button -->
    <div class="find-section">
      <button class="btn-find" id="btn-find-chat">
        <span class="btn-find-icon">⚡</span>
        <span id="btn-find-text">ჩატის პოვნა</span>
      </button>
      <p class="find-hint">შემთხვევითი ადამიანი სამყაროდან</p>
    </div>

    <!-- Waiting State -->
    <div class="waiting-state" id="waiting-state" style="display:none">
      <div class="waiting-anim">
        <div class="wave"></div><div class="wave"></div><div class="wave"></div>
      </div>
      <p class="waiting-text">ველოდები ადამიანს...</p>
      <button class="btn-cancel" id="btn-cancel">გაუქმება</button>
    </div>
  </main>

  <script type="module" src="js/firebase-init.js"></script>
  <script type="module" src="js/lobby.js"></script>
</body>
</html>
